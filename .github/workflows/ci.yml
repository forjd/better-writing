name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for checkout + stdlib Python checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Matrix covers symlink behaviour (ubuntu+windows) and the supported
    # Python range (3.12+3.14). Windows leg exists because the
    # skills/better-writing tap is relative symlinks, which need
    # core.symlinks=true; a Windows checkout without symlink support fails
    # validate.py instead of silently shipping copies.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repo checks (frontmatter, fixtures, symlinks)
        run: python3 scripts/validate.py
      - name: Agent configs parse/schema (stdlib, no new deps)
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys
          ok = True
          for p in sorted(Path("agents").glob("*.yaml")):
              text = p.read_bytes().decode("utf-8-sig")
              name = re.search(r"^name:\s*(.+?)\s*$", text, re.M)
              version = re.search(r"^version:\s*(.+?)\s*$", text, re.M)
              trigger = "$better-writing" in text or "/better-writing" in text
              if not name or not version or not trigger:
                  print(f"FAIL {p}: needs top-level name, version, and $ or / trigger")
                  ok = False
          sys.exit(0 if ok else 1)
      - name: Eval checker self-test
        run: python3 evals/run_evals.py --all evals/examples
