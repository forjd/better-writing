name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo checks (frontmatter, fixtures, symlinks)
        run: python3 scripts/validate.py
      - name: Eval checker self-test
        run: python3 evals/run_evals.py --all evals/examples
