name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for checkout + stdlib Python checks.
permissions:
  contents: read

# Cancel superseded PR runs only, so every commit on main keeps a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Matrix covers symlink behaviour (ubuntu+windows) and the supported
    # Python range (3.12+3.14). Windows leg exists because the
    # skills/better-writing tap is relative symlinks, which need
    # core.symlinks=true; a Windows checkout without symlink support fails
    # validate.py instead of silently shipping copies.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repo checks (frontmatter, fixtures, symlinks, agent configs)
        run: python3 scripts/validate.py
      - name: Eval checker self-test
        run: python3 evals/run_evals.py --all evals/examples

  plugin-manifests:
    # validate.py checks names and versions; this checks the full plugin and
    # marketplace schema with the CLI that loads them. No credentials needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate marketplace manifest
        run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate .
      - name: Validate plugin manifest
        run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate .claude-plugin/plugin.json
