# Keeps the commit-pinned actions in .github/workflows and the CLI version
# that CI validates the plugin manifests with (.github/tools) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
