# Keeps the commit-pinned actions in .github/workflows and the CLI version
# that CI validates the plugin manifests with (.github/tools) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: monthly
    # CI runs the proposed CLI version, so give a bad release a week to be
    # pulled from npm before Dependabot proposes it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
